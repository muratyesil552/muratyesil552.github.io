# ZİNCİR-TR yapılandırması
run:
  eval_days: 14            # geçmiş karne penceresi (past_days)
  forecast_days: 16
  train_days: 180          # Historical Forecast API ile kalıntı model eğitim penceresi
  clim_start_year: 2016    # ERA5 iklim kaydı başlangıcı (~10 yıl)
  cache_ttl_hours: 6
  ledger_keep_days: 30

api:
  forecast: https://api.open-meteo.com/v1/forecast
  hist_forecast: https://historical-forecast-api.open-meteo.com/v1/forecast
  archive: https://archive-api.open-meteo.com/v1/archive
  air_quality: https://air-quality-api.open-meteo.com/v1/air-quality

# Model adları; ilk çalışmayan için sıradaki yedek denenir
models:
  GFS: [gfs_seamless]
  AIFS: [ecmwf_aifs025_single]
  IFS: [ecmwf_ifs, ecmwf_ifs025]
  ICON: [icon_seamless]

thresholds:
  cutout_speed: 25.0
  cutout_gust: 28.0
  ramp_frac_3h: 0.20       # kurulu gücün %20'si / 3 saat
  ramp_da_min_frac: 0.10   # Ramp-DA hesabında "rampa var" eşiği
  event_tol_h: 2           # POD/FAR/CSI eşleştirme toleransı (saat)
  lljs_alpha_min: 0.30
  cloud_collapse_dkt: 0.35

wind_physics:
  wake_min: 0.08
  wake_max: 0.14
  rho_ref: 1.225

solar_physics:
  albedo: 0.2
  gamma_pmp: -0.0040       # 1/K
  faiman_u0: 25.0
  faiman_u1: 6.84
  system_efficiency: 0.88  # kablo, uyumsuzluk, invertör (varsayım)
  aod_atten_k: 0.5         # medyan üstü AOD için ışınım zayıflama katsayısı
  dust_soiling_per_ugm3: 0.0002
  dust_soiling_max: 0.05

hybrid:
  gamma_aci: 0.02
  alpha_target: 0.20       # P10-P90 => %80 kapsama
  aci_window: 336
  ramp_weight: 3.0
  lgbm:
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 15
    min_child_samples: 30
    subsample: 0.8
    colsample_bytree: 0.8
    subsample_freq: 1

sites:
  TR_Canakkale_RES:
    label: Çanakkale RES
    type: wind
    lat: 40.15
    lon: 26.40
    utc_offset: 3
    capacity_mw: 30.0
    hub_m: 100
    z_upper: 100
    cut_in: 3.0
    rated_speed: 12.0
    cut_out: 25.0
    main_axis_deg: 45        # dizilim ana ekseni (KD-GB), iz kaybı yön bağımlılığı için varsayım
  TR_Konya_GES:
    label: Konya Karapınar GES
    type: solar
    lat: 37.75
    lon: 33.55
    utc_offset: 3
    capacity_mw: 20.0
    tilt: 30
    azimuth: 180
  UK_HillOfTowie_RES:
    label: Hill of Towie RES
    type: wind
    lat: 57.515
    lon: -3.111
    utc_offset: 0
    capacity_mw: 48.3
    hub_m: 80
    z_upper: 80
    cut_in: 3.0
    rated_speed: 12.5
    cut_out: 25.0
    main_axis_deg: 45
